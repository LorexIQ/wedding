services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      - NUXT_DB_PATH=/app/data/wedding.db
      - NUXT_SESSION_SECRET=${SESSION_SECRET}
      - NUXT_PUBLIC_CONTACT_PHONE=${CONTACT_PHONE}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
